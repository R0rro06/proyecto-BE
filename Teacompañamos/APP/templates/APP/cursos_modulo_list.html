<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Módulos</h1>
    <ul>
        {% for modulo in modulos %}
            <li>{{ modulo.pregunta }}</li>
        {% endfor %}
    </ul>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for modulo in modulos %}
                <tr>
                    <td>{{ modulo.pregunta }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
