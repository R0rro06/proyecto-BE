<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if object %}Editar rol{% else %}Crear rol{% endif %}</title>
    <link rel="stylesheet" href="{% static 'APP/admin.css' %}">
</head>
<body>
    <header>
        <a href="{% url 'rol_list' %}">← Volver a roles</a>
        <strong>Teacompañamos · Roles</strong>
    </header>
    <main>
        <section class="form-card">
            {% if object %}
                <h1>Editar rol</h1>
            {% else %}
                <h1>Crear rol</h1>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="form-actions">
                    <button type="submit">Guardar</button>
                    <a class="button" href="{% url 'rol_list' %}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
