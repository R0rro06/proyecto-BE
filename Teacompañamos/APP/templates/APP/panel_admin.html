<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administración</title>
</head>
<body>
    <main>
        <h1>Panel de administración</h1>
        <p>Desde aquí puedes gestionar los módulos y las lecciones.</p>

        <section aria-labelledby="modulos-heading">
            <h2 id="modulos-heading">Módulos</h2>
            <p>
                <a href="{% url 'cursos_modulo_list' %}">Ver y administrar módulos</a>
                <a href="{% url 'cursos_modulo_form' %}">Crear módulo</a>
            </p>
        </section>

        <section aria-labelledby="lecciones-heading">
            <h2 id="lecciones-heading">Lecciones</h2>
            <p>
                <a href="{% url 'cursos_leccion_list' %}">Ver y administrar lecciones</a>
                <a href="{% url 'cursos_leccion_form' %}">Crear lección</a>
            </p>
        </section>
    </main>
</body>
</html>
