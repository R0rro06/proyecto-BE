<!DOCTYPE html>
<html lang="es" data-tema="{% if request.COOKIES.tema == 'oscuro' %}oscuro{% else %}claro{% endif %}">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Teacompañamos</title>
    <link rel="stylesheet" href="{% static 'APP/admin.css' %}">
    <link rel="stylesheet" href="{% static 'APP/acceso.css' %}">
    <link rel="stylesheet" href="{% static 'APP/tema.css' %}">
</head>
<body>
    <header><a href="{% url 'inicio' %}">← Volver al inicio</a></header>
    <main>
        <h1>Crear cuenta</h1>
        <section class="form-card">
            <p>Elige tu tipo de usuario y crea una contraseña segura.</p>
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                {{ form.as_p }}
                <button type="submit">Crear cuenta</button>
            </form>
            <p>¿Ya tienes cuenta? <a href="{% url 'acceso_estudiante' %}?tipo={{ tipo }}{% if next %}&amp;next={{ next|urlencode }}{% endif %}">Ingresa</a></p>
        </section>
    </main>
    {% include 'APP/learning/_cookies.html' %}
</body>
</html>
