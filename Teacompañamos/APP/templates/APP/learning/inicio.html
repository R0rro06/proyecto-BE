<!DOCTYPE html>
<html lang="es" data-tema="{% if request.COOKIES.tema == 'oscuro' %}oscuro{% else %}claro{% endif %}">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido | Teacompañamos</title>
    <link rel="stylesheet" href="{% static 'APP/admin.css' %}">
    <link rel="stylesheet" href="{% static 'APP/acceso.css' %}">
    <link rel="stylesheet" href="{% static 'APP/tema.css' %}">
</head>
<body{% if lectura_ampliada %} class="reading-large"{% endif %}>
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 1rem;">
        <strong>Teacompañamos</strong>
        <a href="{% url 'acceso_estudiante' %}?tipo=administrador{% if next %}&amp;next={{ next|urlencode }}{% endif %}" aria-label="Iniciar sesión como administrador" style="font-size: 0.75rem; font-weight: 700; color: #fff; background: #285c48; border: 1px solid #285c48; border-radius: 0.7rem; padding: 0.5rem 0.75rem; text-decoration: none;">Administrador</a>
    </header>
    <main>
        <h1>Bienvenido a Teacompañamos</h1>
        <section class="role-card form-card">
            <h2>Accede a tu cuenta</h2>
            <p>Inicia sesión para continuar. Si aún no tienes cuenta, regístrate y elige tu rol al crearla.</p>
            <div class="role-actions">
                <a href="{% url 'acceso_estudiante' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Iniciar sesión</a>
                <a href="{% url 'registro_usuario' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Crear cuenta</a>
            </div>
        </section>
    </main>
    {% include 'APP/learning/_cookies.html' %}
</body>
</html>
