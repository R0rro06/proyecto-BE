<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar lección</title>
</head>
<body>
    <h1>Eliminar lección</h1>
    <p>¿Seguro que quieres eliminar esta lección?</p>
    <p>{{ object.pregunta }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>
    <a href="{% url 'cursos_leccion_list' %}">Cancelar</a>
</body>
</html>
